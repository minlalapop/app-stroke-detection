services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: med_stroke
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d med_stroke"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@database:5432/med_stroke
      FILE_STORAGE_ROOT: /app/storage
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-secret-before-deployment}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123}
      FRONTEND_ORIGINS: http://localhost:8088,http://127.0.0.1:8088
    volumes:
      - medical_storage:/app/storage
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "8088:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  medical_storage:
